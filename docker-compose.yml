name: remote-agent-devbox

services:
  database:
    image: postgres:16.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: rad
      POSTGRES_USER: rad
      POSTGRES_PASSWORD: ${RAD_POSTGRES_PASSWORD:?RAD_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rad -d rad"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - control
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/workspace-state/migrations/0001_workspace_state.sql:/docker-entrypoint-initdb.d/001_workspace_state.sql:ro
      - ./packages/agents/migrations/0001_agent_tasks.sql:/docker-entrypoint-initdb.d/002_agent_tasks.sql:ro
      - ./packages/git-artifacts/migrations/0001_git_artifacts.sql:/docker-entrypoint-initdb.d/003_git_artifacts.sql:ro
      - ./packages/git-artifacts/migrations/0002_review_snapshots.sql:/docker-entrypoint-initdb.d/004_review_snapshots.sql:ro
      - ./packages/approvals/migrations/0001_approval_requests.sql:/docker-entrypoint-initdb.d/005_approval_requests.sql:ro
      - ./packages/git-operations/migrations/0001_git_operations.sql:/docker-entrypoint-initdb.d/006_git_operations.sql:ro
      - ./packages/workspace-state/migrations/0002_operational_posture.sql:/docker-entrypoint-initdb.d/007_operational_posture.sql:ro
      - ./packages/audit-events/migrations/0001_audit_events.sql:/docker-entrypoint-initdb.d/008_audit_events.sql:ro
      - ./packages/outbox/migrations/0001_outbox_commands.sql:/docker-entrypoint-initdb.d/009_outbox_commands.sql:ro
      - ./packages/ide-access/migrations/0001_ide_access.sql:/docker-entrypoint-initdb.d/010_ide_access.sql:ro
    security_opt:
      - no-new-privileges:true

  control:
    build:
      context: .
      dockerfile: images/control/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RAD_HOST: 0.0.0.0
      RAD_DATABASE_URL: postgresql://rad:${RAD_POSTGRES_PASSWORD}@database:5432/rad
      RAD_CONTROL_NETWORK: ${RAD_CONTROL_NETWORK:-rad-control}
      RAD_WORKSPACE_NETWORK: ${RAD_WORKSPACE_NETWORK:-rad-workspace}
      RAD_WORKSPACE_IMAGE: ${RAD_WORKSPACE_IMAGE:-remote-agent-devbox-workspace-node:local}
      RAD_ARTIFACT_VOLUME: ${RAD_ARTIFACT_VOLUME:-rad-artifacts}
      RAD_VALIDATOR_IMAGE: ${RAD_VALIDATOR_IMAGE:-remote-agent-devbox-validator:local}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RAD_PORT:-3000}:3000"
    networks:
      - control
      - egress
    volumes:
      - ${RAD_DOCKER_SOCKET:-/run/user/1000/docker.sock}:/var/run/docker.sock
      - artifact-data:/var/lib/rad/artifacts
    security_opt:
      - no-new-privileges:true

  workspace-image:
    image: ${RAD_WORKSPACE_IMAGE:-remote-agent-devbox-workspace-node:local}
    build:
      context: .
      dockerfile: images/workspace-node/Dockerfile
    profiles: ["build"]

  validator-image:
    image: ${RAD_VALIDATOR_IMAGE:-remote-agent-devbox-validator:local}
    build:
      context: .
      dockerfile: images/validator/Dockerfile
    profiles: ["build"]

networks:
  control:
    name: ${RAD_CONTROL_NETWORK:-rad-control}
    internal: true
  workspace:
    name: ${RAD_WORKSPACE_NETWORK:-rad-workspace}
  egress:
    name: remote-agent-devbox-egress

volumes:
  postgres-data:
  artifact-data:
    name: ${RAD_ARTIFACT_VOLUME:-rad-artifacts}
